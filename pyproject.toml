[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whole_embryo_analysis"
version = "0.1.0"
description = "Analysis and visualization for whole-embryo light sheet data"
readme = "README.md"
license = { text = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "zarr",
    "dask[array]",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "seaborn",
    "tifffile",
    "aicsshparam",
    "colorcet",
    "dask-jobqueue",
    "distributed",
    "KDEpy",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["pyvista", "plotly"]
workflow = ["snakemake"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whole_embryo_analysis*"]