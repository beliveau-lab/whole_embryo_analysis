# =============================================================================
# whole_embryo_analysis — Snakemake configuration
# =============================================================================
# All paths and parameters for the three-stage pipeline:
#   1. KDE outlier detection
#   2. Shapespace PCA on spherical harmonic coefficients
#   3. Somite feature extraction

# --- Static input data ---
feature_csv: "/net/beliveau/vol2/instrument/E9.5_306/Zoom_306/dataset_fused_features-JGseg-030926_cclabel.csv"
somite_mask: "/net/beliveau/vol1/project/EKN_whole_embryo_structural_analysis/Somites/E9.5_306/306_all_somites_no_PSM.tif"

nuclear_mask: "/net/beliveau/vol2/instrument/E9.5_306/Zoom_306/dataset_fused_masks_Julia_FT.zarr"
bbox_csv: "/net/beliveau/vol2/instrument/E9.5_306/Zoom_306/dataset_fused_features_Julia_FT_Feb26_bboxes.csv"

embryo_id: 306
somite_lut: "/net/beliveau/vol1/project/EKN_whole_embryo_structural_analysis/Somites/all_embryos_somite_metrics_merged.csv"

# --- Output root (intermediate and final outputs go here) ---
output_dir: "/net/beliveau/vol2/instrument/E9.5_306/Zoom_306/analysis_snakemake"

# --- 1. KDE outlier detection ---
kde:
  density_thresh: 1.0e-10
  n_subsample: 25000
  n_rounds: 5
  # Dask-JobQueue cluster settings (spawned inside the rule)
  dask:
    num_workers: 1
    memory: "8G"
    cores: 5
    processes: 1
    project: "beliveaulab"
    queue: "beliveau-long.q"
    runtime: 7200
    resource_spec: "mfree=8G"
    conda_env: "visualization"
    log_dir: "logs/dask/kde"
    dashboard_port: ":41236"

# --- 2. Shapespace PCA ---
shapespace:
  str_tag: "Global_Skew"
  id_name: "Nuclear_ID"
  lmax: 16
  num_pcs: 6
  store_results: true
  generate_figures: true

# --- 3. Somite feature extraction ---
somite:
  frame_type: "hybrid"          # anatomical | frenet | hybrid
  csv_name: "all_somite_nuclear_features"
  spline_csv_path: "/net/beliveau/vol2/instrument/E9.5_306/Zoom_306/Points_for_anatomy_axes_13_points.csv"           # required when frame_type is frenet or hybrid
  # test_somites: null              # e.g. "L3,R5" to restrict to specific somites
  # Dask-JobQueue cluster settings (spawned inside the rule)
  dask:
    num_workers: 1
    memory: "32G"
    cores: 5
    processes: 5
    project: "beliveaulab"
    queue: "beliveau-long.q"
    runtime: 43200
    resource_spec: "mfree=64G"
    conda_env: "visualization"
    log_dir: "logs/dask/somite"
    dashboard_port: ":41263"
